services:
  postgres:
    image: postgres:16
    container_name: flowdesk-db
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk_dev
      POSTGRES_DB: flowdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: